<div class="container py-5">
  @if (loading()) {
  <div class="text-center py-5"><div class="spinner-border" role="status"></div></div>
  } @else if (notFound()) {
  <div class="text-center py-5">
    <i class="bi bi-folder-x display-4 text-muted"></i>
    <p class="text-muted mt-3">This category doesn't exist.</p>
    <a routerLink="/home" class="btn btn-primary rounded-3">Back to home</a>
  </div>
  } @else {
  <h2 class="fw-bold mb-4 text-capitalize">{{ category()?.name }}</h2>
  @if (!products().length) {
  <p class="text-muted">No products in this category yet.</p>
  } @else {
  <div class="row g-4">
    @for (p of products(); track p._id) {
    <div class="col-6 col-md-4 col-lg-3">
      <app-product-card [product]="p" />
    </div>
    }
  </div>
  }
  }
</div>
